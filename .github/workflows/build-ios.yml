name: Build Native iOS App (Student Scanner)

on:
  push:
    branches:
      - main
    paths:
      - 'student-scanner-ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS IPA Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        working-directory: student-scanner-ios
        run: |
          xcodegen generate

      - name: Build and Archive iOS Application
        working-directory: student-scanner-ios
        run: |
          xcodebuild -project StudentScanner.xcodeproj \
            -scheme StudentScanner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/StudentScanner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Package Payload into Installable IPA
        working-directory: student-scanner-ios
        run: |
          mkdir -p Payload
          cp -r ./build/StudentScanner.xcarchive/Products/Applications/StudentScanner.app Payload/
          zip -qr ../StudentScanner.ipa Payload
          echo "IPA packaging complete!"

      - name: Upload Student Scanner IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentScanner-iOS-IPA
          path: StudentScanner.ipa
          retention-days: 14
